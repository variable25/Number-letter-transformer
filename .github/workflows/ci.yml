# Stage 14: CI. On every push / pull request to main, a fresh Ubuntu runner
# installs our packages and runs the whole pytest suite.
# Red X = a test failed -> branch protection blocks the merge.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read              # the test job only reads the repo, nothing more

concurrency:
  # push twice quickly to the same PR -> cancel the older run, keep the newest
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test                # this exact name is what branch protection asks for
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install serving + test packages
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Show installed versions
        run: python -m pip list

      - name: Run pytest
        # -v = one line per test, -rs = print the reason for every skip at the end
        run: python -m pytest -v -rs